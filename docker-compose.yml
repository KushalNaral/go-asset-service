version: "3.8"

services:
  asset-service:
    image: asset-service:latest
    container_name: asset-service
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      # - /var/lib/jenkins/workspace/ecommerce-api/public:/storage:ro
      - /home/rome/work/ecom/api/storage/app/public:/storage:ro
    environment:
      - BASE_PATH=/storage
      - PORT=:8080
      # - CACHE_SIZE=1024
      # - CACHE_TTL=24h
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
