services:
  asset-service:
    build: .
    image: asset-service:latest
    container_name: asset-service
    restart: unless-stopped
    # Host nginx proxies /storage here; only reachable from the server itself.
    ports:
      - "127.0.0.1:8087:8080"
    # Same network as the API stack, so the origin is the API's nginx container
    # and Laravel reaches the admin API at http://asset-service:8080.
    networks:
      - ecommerce_network
    env_file:
      - .env
    environment:
      - PORT=:8080
      - ORIGIN_URL=${ORIGIN_URL:-http://ecommerce_nginx/storage}
      - STATS_FILE=/data/stats.json
    volumes:
      - asset-data:/data
    read_only: true
    mem_limit: 1g

volumes:
  asset-data:

networks:
  ecommerce_network:
    external: true
